name: Arida dehumidifier
products:
  - id: sm6d8sjkdh2trbug
    manufacturer: Arida
    model: Oslo
entities:
  - entity: humidifier
    class: dehumidifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 6
        type: integer
        name: current_humidity
      - id: 103
        type: string
        name: humidity
        mapping:
          - dps_val: "40"
            value: 40
          - dps_val: "45"
            value: 45
          - dps_val: "50"
            value: 50
          - dps_val: "55"
            value: 55
          - dps_val: "60"
            value: 60
          - dps_val: "65"
            value: 65
          - dps_val: "70"
            value: 70
          - dps_val: "75"
            value: 75
          - dps_val: "80"
            value: 80
      - id: 5
        type: string
        name: mode
        mapping:
          - dps_val: AUTO
            value: auto
          - dps_val: SLEEP
            value: sleep
          - dps_val: LOW
            value: low
          - dps_val: HIGH
            value: high
  - entity: select
    name: Target humidity
    icon: "mdi:water-percent"
    dps:
      - id: 103
        type: string
        name: option
        mapping:
          - dps_val: "40"
            value: "40 %"
          - dps_val: "45"
            value: "45 %"
          - dps_val: "50"
            value: "50 %"
          - dps_val: "55"
            value: "55 %"
          - dps_val: "60"
            value: "60 %"
          - dps_val: "65"
            value: "65 %"
          - dps_val: "70"
            value: "70 %"
          - dps_val: "75"
            value: "75 %"
          - dps_val: "80"
            value: "80 %"
          - dps_val: CONTINUOUS
            value: Continuous
  - entity: sensor
    name: Temperature
    class: temperature
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: C
  - entity: switch
    name: Ionizer
    category: config
    dps:
      - id: 10
        type: boolean
        name: switch
  - entity: light
    name: LED light
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: lock
    name: Child lock
    category: config
    dps:
      - id: 105
        type: boolean
        name: lock
  - entity: select
    name: Swing
    category: config
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: HOLD
            value: Stop
          - dps_val: UP
            value: Up
          - dps_val: FRONT
            value: Front
          - dps_val: WIDE
            value: Wide
  - entity: select
    name: Timer
    category: config
    dps:
      - id: 17
        type: string
        name: option
        mapping:
          - dps_val: CANCEL
            value: "Off"
          - dps_val: 1hr
            value: 1 hour
          - dps_val: 2hr
            value: 2 hours
          - dps_val: 3hr
            value: 3 hours
          - dps_val: 4hr
            value: 4 hours
          - dps_val: 5hr
            value: 5 hours
          - dps_val: 6hr
            value: 6 hours
          - dps_val: 7hr
            value: 7 hours
          - dps_val: 8hr
            value: 8 hours
          - dps_val: 9hr
            value: 9 hours
          - dps_val: 10hr
            value: 10 hours
          - dps_val: 11hr
            value: 11 hours
          - dps_val: 12hr
            value: 12 hours
  - entity: select
    name: Display brightness
    category: config
    dps:
      - id: 104
        type: string
        name: option
        mapping:
          - dps_val: L0
            value: "Off"
          - dps_val: L1
            value: Level 1
          - dps_val: L2
            value: Level 2
          - dps_val: L3
            value: Level 3
          - dps_val: L4
            value: Level 4
          - dps_val: L5
            value: Level 5
          - dps_val: H
            value: High
